<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>AI Content Agent</title>
</head>
<body class="bg-gray-50 text-gray-800">
<div class="max-w-4xl mx-auto p-8">
<h1 class="text-4xl font-bold mb-2">AI Content Agent</h1>
<p class="text-gray-500 mb-8">输入行业关键词，自动生成内容方案</p>
<form method="post" class="bg-white p-6 rounded-2xl shadow space-y-4">
<input name="topic" placeholder="例如：减肥 / 美食 / 副业" class="w-full border p-3 rounded-xl" required>
<button class="bg-black text-white px-6 py-3 rounded-xl">开始生成</button>
</form>
{% if data %}
<div class="mt-8 grid gap-6">
<div class="bg-white p-6 rounded-2xl shadow">
<h2 class="font-bold text-xl mb-3">热门选题</h2>
<ul>{% for i in data.ideas %}<li>• {{ i }}</li>{% endfor %}</ul>
</div>
<div class="bg-white p-6 rounded-2xl shadow">
<h2 class="font-bold text-xl mb-3">爆款标题</h2>
<ul>{% for t in data.titles %}<li>• {{ t }}</li>{% endfor %}</ul>
</div>
<div class="bg-white p-6 rounded-2xl shadow">
<h2 class="font-bold text-xl mb-3">短视频脚本</h2>
<p>{{ data.script }}</p>
</div>
<div class="bg-white p-6 rounded-2xl shadow">
<h2 class="font-bold text-xl mb-3">发布文案</h2>
<p>{{ data.post }}</p>
</div>
</div>
{% endif %}
</div>
</body>
</html>
